<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="เก็บข้อมูล">
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>เก็บข้อมูล</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--sub:#6b6b70;--line:#e3e3e8;--accent:#0a84ff;--danger:#ff3b30}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#9a9aa0;--line:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font-size:28px;margin:0}
.actions{display:flex;gap:16px}
button{font:inherit}
.link{background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=search]{background:var(--card)}
.summary{color:var(--sub);font-size:14px;margin:8px 2px 0;min-height:20px}
.item{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer}
.item:active{opacity:.7}
.row{display:flex;justify-content:space-between;gap:12px}
.item .t{font-weight:600}
.item .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta{color:var(--sub);font-size:14px;margin-top:2px}
.item .note{color:var(--sub);font-size:14px;margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:#fff;font-size:34px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:10}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar h2{font-size:17px;margin:0}
.bar .save{font-weight:600}
label{display:block;font-size:13px;color:var(--sub);margin:12px 2px 4px}
textarea{min-height:110px;resize:vertical}
.del{margin-top:20px;width:100%;background:var(--card);color:var(--danger);border:0;border-radius:10px;padding:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>เก็บข้อมูล</h1>
      <div class="actions">
        <button id="btnExport" class="link" type="button">ส่งออก</button>
        <button id="btnImport" class="link" type="button">นำเข้า</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="ค้นหา" autocomplete="off">
    <div id="summary" class="summary"></div>
  </header>
  <main id="list"></main>
</div>

<button id="fab" class="fab" type="button" aria-label="เพิ่มรายการ">+</button>
<input id="file" type="file" accept=".csv,text/csv" hidden>
<div id="toast" class="toast"></div>

<div id="overlay" class="overlay">
  <form id="form" class="sheet" autocomplete="off">
    <div class="bar">
      <button id="btnCancel" class="link" type="button">ยกเลิก</button>
      <h2 id="formTitle">รายการใหม่</h2>
      <button class="link save" type="submit">บันทึก</button>
    </div>
    <label for="fTitle">ชื่อรายการ</label>
    <input id="fTitle" required>
    <label for="fCat">หมวดหมู่</label>
    <input id="fCat" list="cats">
    <datalist id="cats"></datalist>
    <label for="fAmount">ตัวเลข</label>
    <input id="fAmount" type="number" inputmode="decimal" step="any">
    <label for="fDate">วันที่-เวลา</label>
    <input id="fDate" type="datetime-local">
    <label for="fNote">บันทึกเพิ่มเติม</label>
    <textarea id="fNote"></textarea>
    <button id="btnDelete" class="del" type="button">ลบรายการนี้</button>
  </form>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const DEFAULT_CATS = ['ทั่วไป', 'งาน', 'การเงิน', 'สุขภาพ', 'สต็อก', 'อื่นๆ'];
const STORE = 'entries';
let db = null, entries = [], editingId = null;

/* ---------- ฐานข้อมูล (IndexedDB) ---------- */
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('datacollector', 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = mode => db.transaction(STORE, mode).objectStore(STORE);
async function reload() { entries = await req(store('readonly').getAll()); render(); }

/* ---------- ตัวช่วย ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function showDate(s) {
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- แสดงรายการ ---------- */
function render() {
  const q = $('#search').value.trim().toLowerCase();
  const list = entries
    .filter(e => !q || [e.title, e.category, e.note].some(s => (s || '').toLowerCase().includes(q)))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const total = list.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  $('#summary').textContent = entries.length ? `${list.length} รายการ · รวม ${fmt(total)}` : '';
  $('#list').innerHTML = list.length
    ? list.map(e => `
      <div class="item" data-id="${e.id}">
        <div class="row"><span class="t">${esc(e.title) || '(ไม่มีชื่อ)'}</span><span class="amt">${fmt(e.amount)}</span></div>
        <div class="meta">${esc(e.category)} · ${esc(showDate(e.date))}</div>
        ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
      </div>`).join('')
    : `<div class="empty">${entries.length ? 'ไม่พบรายการที่ค้นหา' : 'ยังไม่มีข้อมูล<br>กดปุ่ม + เพื่อเพิ่มรายการแรก'}</div>`;
  const cats = new Set([...DEFAULT_CATS, ...entries.map(e => e.category).filter(Boolean)]);
  $('#cats').innerHTML = [...cats].map(c => `<option value="${esc(c)}">`).join('');
}

/* ---------- ฟอร์ม เพิ่ม / แก้ไข / ลบ ---------- */
function openForm(id) {
  const e = id != null ? entries.find(x => x.id === id) : null;
  editingId = e ? e.id : null;
  $('#formTitle').textContent = e ? 'แก้ไขรายการ' : 'รายการใหม่';
  $('#fTitle').value = e ? e.title : '';
  $('#fCat').value = e ? e.category : 'ทั่วไป';
  $('#fAmount').value = e ? e.amount : '';
  $('#fDate').value = e ? e.date : nowLocal();
  $('#fNote').value = e ? e.note : '';
  $('#btnDelete').style.display = e ? 'block' : 'none';
  $('#overlay').classList.add('show');
  if (!e) setTimeout(() => $('#fTitle').focus(), 50);
}
const closeForm = () => $('#overlay').classList.remove('show');

$('#fab').onclick = () => openForm(null);
$('#btnCancel').onclick = closeForm;
$('#overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay') closeForm(); });
$('#list').addEventListener('click', ev => {
  const el = ev.target.closest('.item');
  if (el) openForm(Number(el.dataset.id));
});
$('#search').addEventListener('input', render);

$('#form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const rec = {
    title: $('#fTitle').value.trim(),
    category: $('#fCat').value.trim() || 'ทั่วไป',
    amount: parseFloat($('#fAmount').value) || 0,
    note: $('#fNote').value,
    date: $('#fDate').value || nowLocal()
  };
  if (editingId != null) rec.id = editingId;
  try {
    await req(store('readwrite').put(rec));
    closeForm();
    await reload();
    toast('บันทึกแล้ว');
  } catch (err) { toast('บันทึกไม่สำเร็จ: ' + err.message); }
});

$('#btnDelete').onclick = async () => {
  if (editingId == null || !confirm('ลบรายการนี้?')) return;
  await req(store('readwrite').delete(editingId));
  closeForm();
  await reload();
  toast('ลบแล้ว');
};

/* ---------- ส่งออก / นำเข้า CSV ---------- */
const csvCell = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
function buildCSV() {
  const rows = [...entries].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const lines = ['วันที่,ชื่อรายการ,หมวดหมู่,ตัวเลข,บันทึก'];
  for (const e of rows) lines.push([csvCell(e.date), csvCell(e.title), csvCell(e.category), Number(e.amount) || 0, csvCell(e.note)].join(','));
  return '\uFEFF' + lines.join('\n');   // BOM ให้ Excel อ่านภาษาไทยได้
}
function exportCSV() {
  if (!entries.length) return toast('ยังไม่มีข้อมูลให้ส่งออก');
  const csv = buildCSV();
  const name = `data-${nowLocal().slice(0, 10)}.csv`;
  const file = new File([csv], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(err => { if (err.name !== 'AbortError') toast('ส่งออกไม่สำเร็จ'); });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
async function importCSV(file) {
  const text = (await file.text()).replace(/^\uFEFF/, '');
  const rows = parseCSV(text).slice(1).filter(r => r.length >= 2 && r.some(x => x.trim() !== ''));
  if (!rows.length) return toast('ไม่พบข้อมูลในไฟล์');
  if (!confirm(`นำเข้า ${rows.length} รายการ? (จะเพิ่มต่อจากข้อมูลเดิม)`)) return;
  const tx = db.transaction(STORE, 'readwrite');
  const os = tx.objectStore(STORE);
  for (const r of rows) {
    os.add({ date: r[0] || nowLocal(), title: r[1] || '', category: r[2] || 'ทั่วไป', amount: parseFloat(r[3]) || 0, note: r[4] || '' });
  }
  await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  await reload();
  toast(`นำเข้า ${rows.length} รายการแล้ว`);
}
$('#btnExport').onclick = exportCSV;
$('#btnImport').onclick = () => $('#file').click();
$('#file').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (f) { try { await importCSV(f); } catch (err) { toast('นำเข้าไม่สำเร็จ: ' + err.message); } }
});

/* ---------- เริ่มทำงาน ---------- */
(async function init() {
  try {
    db = await openDB();
    await reload();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (err) {
    $('#list').innerHTML = '<div class="empty">เปิดฐานข้อมูลไม่ได้<br>ลองปิดโหมดส่วนตัวของ Safari</div>';
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
